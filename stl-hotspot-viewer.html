<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Interactive STL Hotspot Viewer</title>

<style>
* {
    box-sizing: border-box;
}

html, body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    font-family: Arial, sans-serif;
}

body {
    display: flex;
    flex-direction: column;
    background: #edf0f4;
}

/* TOOLBAR */

#toolbar {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 7px;
    padding: 10px;
    background: #202936;
    color: white;
    z-index: 10;
}

button {
    border: none;
    border-radius: 5px;
    padding: 9px 13px;
    font-size: 14px;
    cursor: pointer;
}

#addBtn {
    background: #1976d2;
    color: white;
}

#cancelBtn {
    background: #e6eaf0;
    color: #222;
}

#clearBtn {
    background: #b83232;
    color: white;
}

#status {
    flex: 1;
    min-width: 150px;
    font-size: 13px;
}

/* VIEWER */

#viewer {
    position: relative;
    flex: 1;
    min-height: 0;
    overflow: hidden;
    background: #e9edf2;
}

canvas {
    display: block;
    width: 100%;
    height: 100%;
}

/* HOTSPOTS */

#hotspotLayer {
    position: absolute;
    inset: 0;
    pointer-events: none;
    overflow: hidden;
}

.hotspot {
    position: absolute;
    transform: translate(-50%, -50%);
    width: 27px;
    height: 27px;
    border: 2px solid white;
    border-radius: 50%;
    background: #e53935;
    color: white;
    font-weight: bold;
    font-size: 13px;
    box-shadow: 0 2px 6px #0007;
    cursor: pointer;
    pointer-events: auto;
    padding: 0;
}

.hotspot:hover {
    background: #a91515;
    transform: translate(-50%, -50%) scale(1.15);
}

/* INFORMATION BOX */

#infoBox {
    display: none;
    position: absolute;
    left: 12px;
    bottom: 12px;
    width: min(350px, calc(100% - 24px));
    max-height: 45%;
    overflow-y: auto;
    background: white;
    border-radius: 9px;
    padding: 16px;
    box-shadow: 0 3px 18px #0004;
    z-index: 5;
}

#infoTitle {
    font-size: 18px;
    margin: 0 25px 10px 0;
}

#infoDescription {
    font-size: 14px;
    line-height: 1.5;
    white-space: pre-wrap;
}

#closeInfo {
    position: absolute;
    top: 7px;
    right: 8px;
    background: transparent;
    font-size: 21px;
    padding: 2px 7px;
}

#deleteBtn {
    background: #b83232;
    color: white;
    margin-top: 12px;
}

#help {
    background: white;
    padding: 8px;
    font-size: 12px;
    color: #555;
    border-top: 1px solid #ddd;
}

@media(max-width: 520px) {
    #toolbar {
        padding: 7px;
        gap: 5px;
    }

    button {
        padding: 8px;
        font-size: 12px;
    }

    #status {
        flex-basis: 100%;
    }
}
</style>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
  }
}
</script>

</head>

<body>

<!-- TOOLBAR -->

<div id="toolbar">

    <button id="addBtn">
        + Add hotspot
    </button>

    <button id="cancelBtn" disabled>
        Cancel
    </button>

    <button id="clearBtn">
        Delete all hotspots
    </button>

    <span id="status">
        Loading 3D model...
    </span>

</div>


<!-- 3D VIEWER -->

<div id="viewer">

    <div id="hotspotLayer"></div>

    <!-- INFORMATION BOX -->

    <div id="infoBox">

        <button id="closeInfo">×</button>

        <h3 id="infoTitle"></h3>

        <div id="infoDescription"></div>

        <button id="deleteBtn">
            Delete this hotspot
        </button>

    </div>

</div>


<div id="help">
    Drag to rotate · Scroll to zoom ·
    Right-drag to pan · Click hotspots to view information
</div>


<script type="module">

import * as THREE from 'three';

import { STLLoader } from
'three/addons/loaders/STLLoader.js';

import { OrbitControls } from
'three/addons/controls/OrbitControls.js';


/* =====================================
   MODEL URL FROM IFRAME
===================================== */

const params = new URLSearchParams(location.search);

const modelUrl = params.get('model');


/* =====================================
   VARIABLES
===================================== */

const viewer = document.getElementById('viewer');

const layer = document.getElementById('hotspotLayer');

const status = document.getElementById('status');

const infoBox = document.getElementById('infoBox');

const infoTitle = document.getElementById('infoTitle');

const infoDescription =
document.getElementById('infoDescription');

const addBtn = document.getElementById('addBtn');

const cancelBtn = document.getElementById('cancelBtn');

const deleteBtn = document.getElementById('deleteBtn');

const raycaster = new THREE.Raycaster();

const pointer = new THREE.Vector2();

let scene;
let camera;
let renderer;
let controls;
let mesh;

let addingHotspot = false;

let hotspots = [];

let nextId = 1;

let selectedHotspot = null;

let pointerStart = null;

let modelSize = 1;


/* =====================================
   INITIALISE THREE.JS
===================================== */

function init() {

    scene = new THREE.Scene();

    scene.background = new THREE.Color(0xe9edf2);


    camera = new THREE.PerspectiveCamera(
        45,
        viewer.clientWidth / viewer.clientHeight,
        0.1,
        10000
    );


    renderer = new THREE.WebGLRenderer({
        antialias: true
    });

    renderer.setPixelRatio(
        Math.min(window.devicePixelRatio || 1, 2)
    );

    renderer.setSize(
        viewer.clientWidth,
        viewer.clientHeight
    );

    renderer.outputColorSpace = THREE.SRGBColorSpace;

    viewer.appendChild(renderer.domElement);


    /* LIGHTING */

    scene.add(
        new THREE.HemisphereLight(
            0xffffff,
            0x667080,
            2
        )
    );

    const light1 = new THREE.DirectionalLight(
        0xffffff,
        2
    );

    light1.position.set(1, 2, 3);

    scene.add(light1);


    const light2 = new THREE.DirectionalLight(
        0xffffff,
        0.8
    );

    light2.position.set(-2, -1, -2);

    scene.add(light2);


    /* ROTATION CONTROLS */

    controls = new OrbitControls(
        camera,
        renderer.domElement
    );

    controls.enableDamping = true;

    controls.dampingFactor = 0.07;

    controls.screenSpacePanning = true;


    /* MOUSE MOVEMENT TRACKING */

    renderer.domElement.addEventListener(
        'pointerdown',
        event => {
            pointerStart = {
                x: event.clientX,
                y: event.clientY
            };
        }
    );

    renderer.domElement.addEventListener(
        'click',
        onModelClick
    );


    /* BUTTON EVENTS */

    addBtn.addEventListener(
        'click',
        startAdding
    );

    cancelBtn.addEventListener(
        'click',
        stopAdding
    );

    document.getElementById('closeInfo')
        .addEventListener('click', closeInfo);

    deleteBtn.addEventListener(
        'click',
        deleteSelectedHotspot
    );

    document.getElementById('clearBtn')
        .addEventListener('click', clearAllHotspots);


    window.addEventListener('resize', onResize);


    /* LOAD MODEL */

    loadModel();

    animate();

}


/* =====================================
   LOAD STL MODEL
===================================== */

async function loadModel() {

    try {

        if (!modelUrl) {
            throw new Error(
                'No STL URL supplied in the iframe.'
            );
        }

        status.textContent = 'Downloading STL...';

        const response = await fetch(modelUrl);

        if (!response.ok) {
            throw new Error(
                'HTTP error ' + response.status
            );
        }

        const buffer = await response.arrayBuffer();

        status.textContent = 'Processing 3D model...';

        const loader = new STLLoader();

        const geometry = loader.parse(buffer);

        if (!geometry.attributes.position ||
            geometry.attributes.position.count === 0) {
            throw new Error('STL contains no geometry.');
        }

        geometry.computeVertexNormals();

        geometry.computeBoundingBox();


        /* CENTRE MODEL */

        const center = geometry.boundingBox.getCenter(
            new THREE.Vector3()
        );

        geometry.translate(
            -center.x,
            -center.y,
            -center.z
        );


        const size = geometry.boundingBox.getSize(
            new THREE.Vector3()
        );

        modelSize = Math.max(
            size.x,
            size.y,
            size.z
        ) || 1;


        /* CREATE MODEL */

        const material = new THREE.MeshStandardMaterial({

            color: 0xb8c2cf,

            metalness: 0.12,

            roughness: 0.62,

            side: THREE.DoubleSide

        });


        mesh = new THREE.Mesh(
            geometry,
            material
        );

        scene.add(mesh);


        /* CAMERA POSITION */

        camera.up.set(0, 0, 1);

        const distance = modelSize * 2.25;

        camera.position.set(
            distance,
            -distance * 0.3,
            0
        );

        camera.near = Math.max(
            modelSize / 1000,
            0.01
        );

        camera.far = modelSize * 100;

        camera.updateProjectionMatrix();

        controls.target.set(0, 0, 0);

        controls.update();


        status.textContent = '3D model loaded successfully.';

        loadSavedHotspots();

    }

    catch(error) {

        console.error(error);

        status.textContent =
            'ERROR: ' + error.message;

    }

}


/* =====================================
   START ADDING HOTSPOTS
===================================== */

function startAdding() {

    if (!mesh) return;

    addingHotspot = true;

    cancelBtn.disabled = false;

    renderer.domElement.style.cursor = 'crosshair';

    status.textContent =
        'Click on the model to place a hotspot.';

}


/* =====================================
   CANCEL ADDING HOTSPOTS
===================================== */

function stopAdding() {

    addingHotspot = false;

    cancelBtn.disabled = true;

    renderer.domElement.style.cursor = 'grab';

    status.textContent =
        'Drag the model to rotate it.';

}


/* =====================================
   CLICK ON MODEL TO ADD HOTSPOT
===================================== */

function onModelClick(event) {

    if (!addingHotspot || !mesh) return;

    if (event.target !== renderer.domElement) return;


    /* Ignore rotation drags */

    if (pointerStart) {

        const movement = Math.hypot(
            event.clientX - pointerStart.x,
            event.clientY - pointerStart.y
        );

        if (movement > 5) return;

    }


    const rect =
        renderer.domElement.getBoundingClientRect();


    pointer.x =
        ((event.clientX - rect.left) / rect.width) * 2 - 1;

    pointer.y =
        -((event.clientY - rect.top) / rect.height) * 2 + 1;


    raycaster.setFromCamera(pointer, camera);


    const hits = raycaster.intersectObject(mesh, false);

    if (!hits.length) return;


    /* GET HOTSPOT TITLE */

    const title = prompt('Enter hotspot title:');

    if (title === null || !title.trim()) return;


    /* GET INFORMATION */

    const description = prompt(
        'Enter information for this hotspot:',
        ''
    );

    if (description === null) return;


    /* CONVERT TO MODEL LOCAL COORDINATES */

    const localPoint = mesh.worldToLocal(
        hits[0].point.clone()
    );


    const hotspot = {

        id: nextId++,

        title: title.trim(),

        description: description,

        point: localPoint.toArray(),

        element: null

    };


    hotspots.push(hotspot);

    renderHotspots();

    saveHotspots();

    stopAdding();

    status.textContent =
        'Hotspot added: ' + title.trim();

}


/* =====================================
   DISPLAY HOTSPOTS
===================================== */

function renderHotspots() {

    layer.innerHTML = '';

    hotspots.forEach((item, index) => {

        const button = document.createElement('button');

        button.className = 'hotspot';

        button.textContent = index + 1;

        button.title = item.title;

        button.type = 'button';


        button.addEventListener('click', event => {

            event.stopPropagation();

            showInfo(item);

        });


        layer.appendChild(button);

        item.element = button;

    });

}


/* =====================================
   SHOW INFORMATION
===================================== */

function showInfo(item) {

    selectedHotspot = item;

    infoTitle.textContent = item.title;

    infoDescription.textContent = item.description;

    infoBox.style.display = 'block';

}


/* =====================================
   CLOSE INFORMATION
===================================== */

function closeInfo() {

    infoBox.style.display = 'none';

    selectedHotspot = null;

}


/* =====================================
   DELETE INDIVIDUAL HOTSPOT
===================================== */

function deleteSelectedHotspot() {

    if (!selectedHotspot) return;

    const id = selectedHotspot.id;

    hotspots = hotspots.filter(
        item => item.id !== id
    );

    closeInfo();

    renderHotspots();

    saveHotspots();

    status.textContent = 'Hotspot deleted.';

}


/* =====================================
   DELETE ALL HOTSPOTS
===================================== */

function clearAllHotspots() {

    if (hotspots.length === 0) return;

    if (!confirm('Delete all hotspots?')) return;

    hotspots = [];

    nextId = 1;

    closeInfo();

    renderHotspots();

    saveHotspots();

    status.textContent = 'All hotspots deleted.';

}


/* =====================================
   POSITION HOTSPOTS ON ROTATING MODEL
===================================== */

function updateHotspots() {

    if (!mesh) return;

    const width = viewer.clientWidth;

    const height = viewer.clientHeight;


    hotspots.forEach(item => {

        /* Convert model position into world position */

        const worldPosition = mesh.localToWorld(
            new THREE.Vector3(...item.point)
        );


        /* Convert world position into screen position */

        const projected = worldPosition.clone();

        projected.project(camera);


        const visible =
            projected.z > -1 &&
            projected.z < 1 &&
            Math.abs(projected.x) <= 1 &&
            Math.abs(projected.y) <= 1;


        /* Check whether another part of the model
           is in front of the hotspot */

        let notOccluded = false;

        if (visible) {

            const direction = worldPosition.clone()
                .sub(camera.position);

            const distance = direction.length();

            direction.normalize();

            raycaster.set(
                camera.position,
                direction
            );

            const intersections =
                raycaster.intersectObject(mesh, false);

            notOccluded =
                intersections.length === 0 ||
                intersections[0].distance >=
                distance - modelSize * 0.002;

        }


        const show = visible && notOccluded;

        item.element.style.display =
            show ? 'block' : 'none';


        if (show) {

            item.element.style.left =
                ((projected.x * 0.5 + 0.5) * width) + 'px';

            item.element.style.top =
                ((-projected.y * 0.5 + 0.5) * height) + 'px';

        }

    });

}


/* =====================================
   SAVE HOTSPOTS
===================================== */

function saveHotspots() {

    try {

        const data = hotspots.map(item => ({

            id: item.id,

            title: item.title,

            description: item.description,

            point: item.point

        }));

        localStorage.setItem(
            'stl-hotspots:' + modelUrl,
            JSON.stringify(data)
        );

    }

    catch(error) {

        console.warn('Could not save hotspots.', error);

    }

}


/* =====================================
   LOAD SAVED HOTSPOTS
===================================== */

function loadSavedHotspots() {

    try {

        const saved = JSON.parse(
            localStorage.getItem(
                'stl-hotspots:' + modelUrl
            ) || '[]'
        );


        if (Array.isArray(saved)) {

            hotspots = saved.filter(item =>
                item &&
                Array.isArray(item.point) &&
                item.point.length === 3
            ).map(item => ({

                id: Number(item.id),

                title: String(item.title || ''),

                description: String(item.description || ''),

                point: item.point.map(Number),

                element: null

            }));


            nextId = hotspots.reduce(
                (max, item) => Math.max(max, item.id || 0),
                0
            ) + 1;


            renderHotspots();

            if (hotspots.length) {

                status.textContent =
                    hotspots.length + ' saved hotspots loaded.';

            }

        }

    }

    catch(error) {

        console.warn('Could not load saved hotspots.', error);

    }

}


/* =====================================
   RESIZE
===================================== */

function onResize() {

    if (!camera || !renderer) return;

    camera.aspect =
        viewer.clientWidth / viewer.clientHeight;

    camera.updateProjectionMatrix();

    renderer.setSize(
        viewer.clientWidth,
        viewer.clientHeight
    );

}


/* =====================================
   ANIMATION LOOP
===================================== */

function animate() {

    requestAnimationFrame(animate);

    if (controls) controls.update();

    if (renderer && scene && camera) {

        renderer.render(scene, camera);

        updateHotspots();

    }

}


/* =====================================
   START VIEWER
===================================== */

init();

</script>

</body>
</html>
